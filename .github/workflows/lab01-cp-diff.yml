name: Lab01 cp and diff on Ubuntu
on:
  push:
    branches: [feat/lab01-cp]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install RISC-V and QEMU
        run: sudo apt-get update && sudo apt-get install -y build-essential perl python3 gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc
      - name: Build and test
        run: python3 tests/lab01/run.py --log /tmp/xv6-lab01-qemu.log
      - name: Upload QEMU log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xv6-lab01-qemu-log
          path: /tmp/xv6-lab01-qemu.log
